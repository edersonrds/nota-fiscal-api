spring.application.name=nota-fiscal-api
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.accept-float-as-int=false
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:notafiscal}
spring.datasource.username=${POSTGRES_USER:notafiscal}
spring.datasource.password=${POSTGRES_PASSWORD:notafiscal}
nota-fiscal.frete.modo=ACRESCIMO
