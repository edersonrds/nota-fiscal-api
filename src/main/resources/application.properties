spring.application.name=nota-fiscal-api
spring.threads.virtual.enabled=true
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.accept-float-as-int=false
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:notafiscal}
spring.datasource.username=${POSTGRES_USER:notafiscal}
spring.datasource.password=${POSTGRES_PASSWORD:notafiscal}
nota-fiscal.frete.modo=ACRESCIMO
nota-fiscal.integracoes.latencia.estoque=300ms
nota-fiscal.integracoes.latencia.registro=200ms
nota-fiscal.integracoes.latencia.entrega=400ms
nota-fiscal.integracoes.latencia.financeiro=250ms
logging.pattern.correlation=[%X{correlationId:-}] 
logging.structured.ecs.service.name=${spring.application.name}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
